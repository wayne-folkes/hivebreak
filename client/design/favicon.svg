<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- A Drone on a dark badge, one unit per pixel. render.sh squares the badge for the Apple icon. -->
  <rect id="badge" width="16" height="16" rx="3" fill="#0b0820"/>
  <!-- Antennae -->
  <g fill="#ffe14f">
    <rect x="4" y="2" width="1" height="1"/>
    <rect x="11" y="2" width="1" height="1"/>
  </g>
  <g fill="#7a33c8">
    <rect x="5" y="3" width="1" height="1"/>
    <rect x="10" y="3" width="1" height="1"/>
    <rect x="6" y="4" width="1" height="1"/>
    <rect x="9" y="4" width="1" height="1"/>
  </g>
  <!-- Body -->
  <g fill="#b04cff">
    <rect x="5" y="5" width="6" height="1"/>
    <rect x="3" y="6" width="10" height="1"/>
    <rect x="2" y="7" width="12" height="2"/>
  </g>
  <rect x="3" y="9" width="10" height="1" fill="#8a35d6"/>
  <rect x="5" y="10" width="6" height="1" fill="#6a2bb0"/>
  <!-- Visor and eyes -->
  <rect x="4" y="7" width="8" height="2" fill="#2a0f52"/>
  <g fill="#ffe14f">
    <rect x="5" y="7" width="2" height="2"/>
    <rect x="9" y="7" width="2" height="2"/>
  </g>
  <!-- Legs -->
  <g fill="#7a33c8">
    <rect x="4" y="11" width="1" height="2"/>
    <rect x="3" y="13" width="1" height="1"/>
    <rect x="7" y="11" width="2" height="2"/>
    <rect x="11" y="11" width="1" height="2"/>
    <rect x="12" y="13" width="1" height="1"/>
  </g>
</svg>
